[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
arc_mainnet = "https://rpc.mainnet.arc.io"
arc_mainnet_drpc = "https://rpc.drpc.mainnet.arc.io"
arc_mainnet_blockdaemon = "https://rpc.blockdaemon.mainnet.arc.io"
arc_mainnet_quicknode = "https://rpc.quicknode.mainnet.arc.io"
arc_testnet = "https://rpc.testnet.arc.io"
arc_testnet_drpc = "https://rpc.drpc.testnet.arc.io"
arc_testnet_blockdaemon = "https://rpc.blockdaemon.testnet.arc.io"
arc_testnet_quicknode = "https://rpc.quicknode.testnet.arc.io"

[etherscan]
arc_mainnet = { key = "empty", url = "https://explorer.arc.io/api/" }
arc_testnet = { key = "empty", url = "https://explorer.testnet.arc.io/api/" }
